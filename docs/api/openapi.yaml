                type: /problems/idempotency-key-mismatch
                title: Невідповідність ключа ідемпотентності
                status: 422
                detail: Idempotency-Key уже використано з іншим тілом запиту.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    TooManyRequests:
      description: Перевищено ліміт запитів (SRS-NFR-SEC-08) або добовий ліміт вартості генерації (SRS-NFR-COST-02).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rateLimit:
              summary: Ліміт запитів
              value:
                type: /problems/rate-limited
                title: Забагато запитів
                status: 429
                detail: Ліміт 100 запитів/хв вичерпано.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            budget:
              summary: Добовий ліміт вартості
              value:
                type: /problems/budget-exceeded
                title: Добовий ліміт вартості вичерпано
                status: 429
                detail: Нові задачі генерації приймаються після 00:00 UTC.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    InternalError:
      description: Непередбачена помилка сервера; деталі лише в журналі за requestId.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internal:
              summary: Внутрішня помилка
              value:
                type: /problems/internal-error
                title: Внутрішня помилка сервера
                status: 500
                detail: Запит не виконано; зверніться до адміністратора з requestId.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    ServiceUnavailable:
      description: PostgreSQL або Redis тимчасово недоступні.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              summary: Залежність недоступна
              value:
                type: /problems/service-unavailable
                title: Сервіс тимчасово недоступний
                status: 503
                detail: Черга задач недоступна; повторіть запит пізніше.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Problem:
      type: object
      description: Опис помилки за RFC 9457 (application/problem+json). Члени-розширення дозволені стандартом.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 200
          description: Ідентифікатор типу помилки, відносний URI каталогу /problems/.
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          format: uri-reference
          maxLength: 500
        requestId:
          type: string
          maxLength: 64
          description: Ідентифікатор запиту з журналу (SRS-NFR-OBS-01).
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - pointer
              - detail
            properties:
              pointer:
                type: string
                maxLength: 200
                description: JSON Pointer (RFC 6901) на поле запиту.
              detail:
                type: string
                maxLength: 500
          minItems: 1
          maxItems: 50
        attemptId:
          type: string
          format: uuid
          description: "Член-розширення типу attempt-in-progress: ідентифікатор незавершеної спроби для її продовження."
    CourseRole:
      type: string
      enum:
        - owner
        - co_instructor
        - student
      description: ENUM course_role. Роль користувача в курсі.
    ControlEventType:
      type: string
      enum:
        - current
        - module
        - credit
        - exam
      description: ENUM control_event_type. Тип контрольного заходу.
    QuestionType:
      type: string
      enum:
        - single
        - multi
      description: ENUM question_type. single — один правильний варіант, multi — один або більше.
    QuestionStatus:
      type: string
      enum:
        - draft
        - approved
        - rejected
      description: ENUM question_status. Життєвий цикл питання.
    QuestionSource:
      type: string
      enum:
        - lecture
        - source_test
        - manual
      description: ENUM question_source. Джерело питання.
    AttemptMode:
      type: string
      enum:
        - daily_plan
        - practice
        - mock_test
      description: ENUM attempt_mode. Режим спроби.
    AttemptStatus:
      type: string
      enum:
        - in_progress
        - finished
        - expired
      description: ENUM attempt_status. Стан спроби.
    AttemptEventType:
      type: string
      enum:
        - app_background
        - app_foreground
        - screenshot
        - screen_recording
      description: ENUM attempt_event_type. Подія антисписування.
    GenerationJobType:
      type: string
      enum:
        - lecture_test
        - mock_questions
      description: ENUM generation_job_type. Тип задачі генерації.
    GenerationJobStatus:
      type: string
      enum:
        - queued
        - processing
        - done
        - failed
        - dead
      description: ENUM generation_job_status. Стан задачі генерації.
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Корпоративна пошта закладу; домен перевіряється за ALLOWED_EMAIL_DOMAINS.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: Ім'я або псевдонім.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Корпоративна пошта закладу; домен перевіряється за ALLOWED_EMAIL_DOMAINS.
    EmailTokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          description: Одноразовий токен з посилання в листі (32 випадкові байти, base64url).
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Корпоративна пошта закладу; домен перевіряється за ALLOWED_EMAIL_DOMAINS.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - tokenType
        - accessToken
        - expiresIn
        - refreshToken
        - refreshExpiresIn
      properties:
        tokenType:
          type: string
          enum:
            - Bearer
        accessToken:
          type: string
          maxLength: 2048
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          description: JWT, HS256, строк дії 15 хв (SRS-NFR-SEC-01).
        expiresIn:
          type: integer
          enum:
            - 900
          description: Строк дії access-токена, с.
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          description: Непрозорий refresh-токен; у БД зберігається SHA-256. Ротація при кожному оновленні (SRS-NFR-SEC-02).
        refreshExpiresIn:
          type: integer
          enum:
            - 2592000
          description: Строк дії refresh-токена, с (30 днів).
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - emailVerified
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
          description: Корпоративна пошта закладу; домен перевіряється за ALLOWED_EMAIL_DOMAINS.
        displayName:
          type: string
          maxLength: 64
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Course:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - myRole
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        myRole:
          $ref: "#/components/schemas/CourseRole"
        createdAt:
          type: string
          format: date-time
    CourseCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
          minItems: 0
          maxItems: 100
      description: Курс із назвою дисципліни і впорядкованим переліком тем (SRS-FUN-07).
    CourseUpdate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    CoursePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Member:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - role
        - joinedAt
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 64
        role:
          $ref: "#/components/schemas/CourseRole"
        joinedAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    InviteCodeCreate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - co_instructor
            - student
          description: "Підмножина course_role: owner через код не призначається."
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    InviteCode:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - role
        - expiresAt
        - revokedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[A-HJ-NP-Z2-9]{8}$
          minLength: 8
          maxLength: 8
        role:
          type: string
          enum:
            - co_instructor
            - student
          description: "Підмножина course_role: owner через код не призначається."
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    InviteCodePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InviteCode"
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    MembershipCreate:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[A-HJ-NP-Z2-9]{8}$
          minLength: 8
          maxLength: 8
    Membership:
      type: object
      additionalProperties: false
      required:
        - courseId
        - courseTitle
        - role
        - joinedAt
      properties:
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: "#/components/schemas/CourseRole"
        joinedAt:
          type: string
          format: date-time
    Topic:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - position
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          maximum: 500
    TopicCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          maximum: 500
          description: За відсутності — в кінець переліку.
    TopicUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          maximum: 500
      minProperties: 1
    TopicList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
          minItems: 0
          maxItems: 500
    ControlEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - eventDate
        - topicIds
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ControlEventType"
        eventDate:
          type: string
          format: date
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
    ControlEventCreate:
      type: object
      additionalProperties: false
      required:
        - type
        - eventDate
        - topicIds
      properties:
        type:
          $ref: "#/components/schemas/ControlEventType"
        eventDate:
          type: string
          format: date
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
    ControlEventUpdate:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/ControlEventType"
        eventDate:
          type: string
          format: date
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
      minProperties: 1
    ControlEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ControlEvent"
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    LectureMaterialUpload:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          maxLength: 10485760
          description: PDF ≤ 10 МБ (10 485 760 байт), сигнатура %PDF, ≤ 60 сторінок, ≤ 40 000 токенів тексту (SRS-NFR-SEC-07, SRS-FUN-51).
    LectureMaterial:
      type: object
      additionalProperties: false
      required:
        - id
        - topicId
        - fileName
        - sizeBytes
        - pageCount
        - textTokens
        - uploadedAt
      properties:
        id:
          type: string
          format: uuid
        topicId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        pageCount:
          type: integer
