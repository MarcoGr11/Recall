                detail: Код не існує, відкликаний або строк його дії минув.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            planEmpty:
              summary: План на день порожній
              value:
                type: /problems/plan-empty
                title: План на день порожній
                status: 422
                detail: На сьогодні немає тем для повторення або схвалених питань.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            insufficientPool:
              summary: Недостатньо схвалених питань
              value:
                type: /problems/insufficient-question-pool
                title: Недостатньо схвалених питань
                status: 422
                detail: Для теми і типу single потрібно 10 схвалених питань, наявно 6.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            idempotencyMismatch:
              summary: Ключ ідемпотентності з іншим тілом
