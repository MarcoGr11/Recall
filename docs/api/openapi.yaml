components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access-токен у заголовку Authorization: Bearer <JWT>."
  headers:
    Location:
      description: URI створеного ресурсу або задачі.
      schema:
        type: string
        format: uri-reference
        maxLength: 500
    RetryAfter:
      description: Кількість секунд до повторного запиту.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: Ідентифікатор курсу.
      schema:
        type: string
        format: uuid
    TopicId:
      name: topicId
      in: path
      required: true
      description: Ідентифікатор теми курсу.
      schema:
        type: string
        format: uuid
    ControlEventId:
      name: controlEventId
      in: path
      required: true
      description: Ідентифікатор контрольного заходу.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Ідентифікатор користувача-учасника курсу.
      schema:
        type: string
        format: uuid
    InviteCodeId:
      name: inviteCodeId
      in: path
      required: true
      description: Ідентифікатор коду запрошення.
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      description: Ідентифікатор задачі генерації.
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      description: Ідентифікатор питання.
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      description: Ідентифікатор спроби.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Номер сторінки, з 1.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Кількість елементів на сторінці.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ ідемпотентності клієнта (UUID), зберігається в Redis 24 год. Повтор із тим самим ключем і тілом повертає ту саму задачу; той самий ключ з іншим тілом → 422.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: "Невалідний запит: схема тіла, параметри або одноразовий токен."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validation:
              summary: Помилка валідації полів
              value:
                type: /problems/validation-error
                title: Запит не відповідає схемі
                status: 400
                detail: Поле password коротше за 10 символів.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
                errors:
                  - pointer: /password
                    detail: Мінімальна довжина — 10 символів.
            invalidToken:
              summary: Токен з листа прострочений або використаний
              value:
                type: /problems/invalid-token
                title: Недійсний одноразовий токен
                status: 400
                detail: Строк дії посилання минув або його вже використано.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    Unauthorized:
      description: Відсутній, прострочений або відкликаний токен; невірні облікові дані.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            tokenExpired:
              summary: Access-токен прострочено
              value:
                type: /problems/unauthorized
                title: Потрібна автентифікація
                status: 401
                detail: Строк дії access-токена минув.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            invalidCredentials:
              summary: Невірна пошта або пароль
              value:
                type: /problems/invalid-credentials
                title: Невірні облікові дані
                status: 401
                detail: Невірна пошта або пароль.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            refreshReuse:
              summary: Повторне використання refresh-токена
              value:
                type: /problems/refresh-token-reused
                title: Сесію відкликано
                status: 401
                detail: Повторне використання анульованого refresh-токена; усі токени сесії відкликано.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    Forbidden:
      description: "Недостатньо прав: роль у курсі не дозволяє дію, ресурс іншого курсу або пошту не підтверджено."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            role:
              summary: Роль не дозволяє дію
              value:
                type: /problems/forbidden
                title: Доступ заборонено
                status: 403
                detail: Роль co_instructor не дозволяє видалити курс.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            emailNotVerified:
              summary: Пошту не підтверджено
              value:
                type: /problems/email-not-verified
                title: Пошту не підтверджено
                status: 403
                detail: Вхід можливий після підтвердження пошти за посиланням з листа.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    NotFound:
      description: Ресурс не існує або належить іншому користувачу того самого курсу (BOLA, SRS-FUN-54).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              summary: Ресурс не знайдено
              value:
                type: /problems/not-found
                title: Ресурс не знайдено
                status: 404
                detail: Спробу не знайдено.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    Conflict:
      description: Конфлікт зі станом ресурсу.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            emailTaken:
              summary: Пошта вже зареєстрована
              value:
                type: /problems/email-taken
                title: Пошта вже зареєстрована
                status: 409
                detail: Обліковий запис з цією поштою вже існує.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            versionConflict:
              summary: Конфлікт версії
              value:
                type: /problems/version-conflict
                title: Конфлікт версії
                status: 409
                detail: Питання змінено іншим модератором; актуальна версія 3.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            attemptFinished:
              summary: Спробу завершено
              value:
                type: /problems/attempt-finished
                title: Спробу завершено
                status: 409
                detail: Відповіді до завершеної спроби не приймаються.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            alreadyMember:
              summary: Користувач уже в курсі
              value:
                type: /problems/already-member
                title: Користувач уже є учасником курсу
                status: 409
                detail: Повторне приєднання до курсу не виконується.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            attemptInProgress:
              summary: Незавершена спроба
              value:
                type: /problems/attempt-in-progress
                title: Є незавершена спроба
                status: 409
                detail: Спроба цього режиму ще триває; її можна продовжити.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
                attemptId: 0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
            idempotencyInProgress:
              summary: Запит з ключем ще обробляється
              value:
                type: /problems/idempotency-key-in-progress
                title: Запит обробляється
                status: 409
                detail: Запит з цим Idempotency-Key ще виконується.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
    PayloadTooLarge:
      description: Файл перевищує 10 МБ (SRS-NFR-SEC-07).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            tooLarge:
              summary: Файл завеликий
              value:
                type: /problems/payload-too-large
                title: Файл завеликий
                status: 413
                detail: Розмір файлу 12 582 912 байт перевищує 10 485 760 байт.
