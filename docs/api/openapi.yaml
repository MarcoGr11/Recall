                type: /problems/attempt-expired
                title: Час спроби минув
                status: 422
                detail: Відповідь отримано після deadlineAt спроби.
                instance: /api/v1/courses/0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                requestId: req-7f3a9c2e
            optionMismatch:
              summary: Варіант не належить питанню
