openapi: 3.0.3
info:
  title: Recall REST API
  version: 1.0.0
  description: Контракт REST API системи Recall (Розділ 2, підрозділ 2.5). Автентифікація — JWT Bearer (access 15 хв, refresh 30 днів з ротацією). Помилки — application/problem+json (RFC 9457). Ідентифікатори в шляху — лише UUID. Пагінація — page і limit (limit ≤ 100). Токени і паролі не передаються в query. Розширення x-srs і x-roles містять трасування до SRS і ролі в курсі для матриці маршрутів.
  license:
    name: Proprietary — дипломний проєкт
    url: https://github.com/MarcoGr11/Recall
servers:
  - url: https://{host}/api/v1
    description: Розгортання за reverse proxy Caddy (TLS 1.2+).
    variables:
      host:
        default: recall.local
        description: Домен розгортання; у середовищі розробки — localhost:8080 через Caddy.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Реєстрація, вхід, токени, підтвердження пошти і відновлення пароля.
  - name: Me
    description: Профіль і обліковий запис поточного користувача.
  - name: Courses
    description: Курси, учасники і коди запрошення.
  - name: Content
    description: Теми, контрольні заходи, лекційні матеріали і зразки тестів.
  - name: Generation
    description: Асинхронні задачі генерації через Claude API.
  - name: Moderation
    description: Модерація чернеток питань.
  - name: Learning
    description: План на день, спроби, відповіді і події антисписування.
  - name: Mock tests
    description: Пробні тести до контрольних заходів.
  - name: Monitoring
    description: Теплова карта і підтвердження засвоєння.
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Реєстрація за корпоративною поштою
      description: Створює обліковий запис з непідтвердженою поштою і надсилає лист з посиланням підтвердження (строк дії 24 год). Пароль хешується Argon2id.
      x-srs:
        - SRS-FUN-01
        - SRS-NFR-SEC-03
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: o.koval@chnu.edu.ua
              password: Kv9#plume-river
              displayName: Олена Коваль
      responses:
        "201":
          description: Обліковий запис створено; лист підтвердження надіслано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                id: 0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                email: o.koval@chnu.edu.ua
                displayName: Олена Коваль
                emailVerified: false
                createdAt: "2026-11-24T09:15:00Z"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Підтвердження пошти
      description: Підтверджує пошту одноразовим токеном з листа; токен анулюється після використання.
      x-srs:
        - SRS-FUN-01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTokenRequest"
            example:
              token: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
      responses:
        "204":
          description: Пошту підтверджено.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/verify-email/resend:
    post:
      tags:
        - Auth
      operationId: resendVerificationEmail
      summary: Повторний лист підтвердження
      description: Надсилає новий лист підтвердження і анулює попередні токени. Відповідь завжди 202 незалежно від існування облікового запису.
      x-srs:
        - SRS-FUN-01
        - SRS-NFR-SEC-08
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: o.koval@chnu.edu.ua
      responses:
        "202":
          description: Запит прийнято.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Вхід
      description: Автентифікує користувача з підтвердженою поштою і видає пару токенів. Невірна пошта і невірний пароль не розрізняються у відповіді.
      x-srs:
        - SRS-FUN-02
        - SRS-NFR-SEC-01
        - SRS-NFR-SEC-08
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: o.koval@chnu.edu.ua
              password: Kv9#plume-river
      responses:
        "200":
          description: Пару токенів видано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              example:
                tokenType: Bearer
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkwZjNhMiJ9.c2lnbmF0dXJl
                expiresIn: 900
                refreshToken: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
                refreshExpiresIn: 2592000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshTokens
      summary: Оновлення токенів
      description: Видає нову пару токенів і анулює поданий refresh-токен. Повторне використання анульованого токена відкликає всі токени сімейства.
      x-srs:
        - SRS-NFR-SEC-02
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
      responses:
        "200":
          description: Нову пару токенів видано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              example:
                tokenType: Bearer
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkwZjNhMiJ9.c2lnbmF0dXJl
                expiresIn: 900
                refreshToken: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
                refreshExpiresIn: 2592000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Вихід
      description: Відкликає всі refresh-токени сімейства поточної сесії.
      x-srs:
        - SRS-FUN-53
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
      responses:
        "204":
          description: Сесію завершено.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/password-reset/request:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Запит відновлення пароля
      description: Надсилає на підтверджену пошту одноразове посилання (строк дії 30 хв). Відповідь завжди 202 незалежно від існування адреси (захист від user enumeration); лист надсилається після відповіді, тому час відповіді не залежить від існування адреси. Новий запит анулює попередні невикористані токени користувача.
      x-srs:
        - SRS-FUN-55
        - SRS-NFR-SEC-08
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: o.koval@chnu.edu.ua
      responses:
        "202":
          description: Запит прийнято.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      operationId: confirmPasswordReset
      summary: Встановлення нового пароля
      description: Встановлює новий пароль за одноразовим токеном і відкликає всі refresh-токени користувача.
      x-srs:
        - SRS-FUN-55
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
            example:
              token: Q2xhcmFfUmVjYWxsX0V4YW1wbGVUb2tlbl8xMjM0NTY
              newPassword: Tq4!north-cedar
      responses:
        "204":
          description: Пароль змінено.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me:
    get:
      tags:
        - Me
      operationId: getMyProfile
      summary: Профіль поточного користувача
      description: Повертає профіль за access-токеном.
      x-srs:
        - SRS-FUN-02
      responses:
        "200":
          description: Профіль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                id: 0190f3a2-7c1e-7d4a-9b2f-3c5d6e7f8a91
                email: o.koval@chnu.edu.ua
                displayName: Олена Коваль
                emailVerified: true
                createdAt: "2026-11-24T09:15:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Me
      operationId: deleteMyAccount
      summary: Видалення облікового запису
      description: Знеособлює обліковий запис (deleted_at, email і display_name), відкликає токени; відповіді зберігаються знеособленими для агрегатів курсу. Власник курсу спершу передає або видаляє курс.
      x-srs:
        - SRS-FUN-48
      responses:
        "204":
          description: Обліковий запис видалено.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/daily-plan:
    get:
      tags:
        - Learning
      operationId: getDailyPlan
      summary: План на день
      description: |-
        Повертає попередній перегляд плану з тем-кандидатів усіх курсів студента: ліміт 30 питань, 2…8 на тему пропорційно пріоритету P, не більше 15 тем. Питання видаються під час POST /attempts у режимі daily_plan за планом, сформованим повторно.

        Ролі: student.
      x-srs:
        - SRS-FUN-20
        - SRS-FUN-21
        - SRS-FUN-50
      x-roles:
        - student
      responses:
        "200":
          description: План на сьогодні.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPlan"
              example:
                date: "2026-11-24"
                totalQuestions: 8
                topics:
                  - courseId: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                    topicId: 0190f3a2-9e3a-7f6c-9d4b-5e7f8a9b0c13
                    topicTitle: Нормалізація баз даних
                    priority: 5
                    overdueDays: 3
                    daysToEvent: 5
                    questionCount: 5
                    nextReview: "2026-11-21"
                  - courseId: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                    topicId: 0190f3a2-af4b-708d-ae5c-6f8a9b0c1d24
                    topicTitle: Індекси B-Tree
                    priority: 2
                    overdueDays: 0
                    daysToEvent: 5
                    questionCount: 3
                    nextReview: "2026-11-24"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me/memberships:
    post:
      tags:
        - Courses
      operationId: joinCourse
      summary: Приєднання до курсу за кодом
      description: Приєднує користувача до курсу з роллю коду запрошення, якщо код існує, не відкликаний і чинний.
      x-srs:
        - SRS-FUN-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreate"
            example:
              code: K7M2Q9XA
      responses:
        "201":
          description: Користувача додано до курсу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
              example:
                courseId: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                courseTitle: Бази даних
                role: student
                joinedAt: "2026-11-24T09:20:00Z"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /courses:
    get:
      tags:
        - Courses
      operationId: listMyCourses
      summary: Курси користувача
      description: Повертає курси, в яких користувач має роль.
      x-srs:
        - SRS-FUN-03
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Сторінка курсів.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
              example:
                items:
                  - id: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                    title: Бази даних
                    myRole: owner
                    createdAt: "2026-11-24T09:30:00Z"
                page: 1
                limit: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Courses
      operationId: createCourse
      summary: Створення курсу
      description: Створює курс з упорядкованим переліком тем; автор отримує роль owner.
      x-srs:
        - SRS-FUN-03
        - SRS-FUN-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
            example:
              title: Бази даних
              topics:
                - title: Нормалізація баз даних
                - title: Індекси B-Tree
      responses:
        "201":
          description: Курс створено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
              example:
                id: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                title: Бази даних
                myRole: owner
                createdAt: "2026-11-24T09:30:00Z"
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /courses/{courseId}:
    get:
      tags:
        - Courses
      operationId: getCourse
      summary: Курс
      description: |-
        Повертає курс за ідентифікатором.

        Ролі: owner, co_instructor, student.
      x-srs:
        - SRS-NFR-SEC-05
      x-roles:
        - owner
        - co_instructor
        - student
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Курс.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
              example:
                id: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                title: Бази даних
                myRole: owner
                createdAt: "2026-11-24T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags:
        - Courses
      operationId: updateCourse
      summary: Зміна назви курсу
      description: |-
        Змінює назву курсу.

        Ролі: owner.
      x-srs:
        - SRS-FUN-07
      x-roles:
        - owner
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
            example:
              title: Бази даних і SQL
      responses:
        "200":
          description: Курс оновлено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
              example:
                id: 0190f3a2-8d2f-7e5b-8c3a-4d6e7f8a9b02
                title: Бази даних і SQL
                myRole: owner
                createdAt: "2026-11-24T09:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Courses
      operationId: deleteCourse
      summary: Видалення курсу
      description: |-
        Позначає курс видаленим (deleted_at). Запит co_instructor → 403.

        Ролі: owner.
      x-srs:
        - SRS-FUN-06
        - SRS-FUN-12
      x-roles:
        - owner
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: Курс видалено.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
