# Оцінні та маркетингові слова замість вимірюваних характеристик.
extends: existence
message: "Оцінне слово «%s»: замінити вимірюваною характеристикою."
level: warning
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^а-яіїєґʼ''a-z])(інтуїтивн[а-яіїєґ]*|крут(?:ий|а|е|і|ого|ому)|зручн[а-яіїєґ]*|унікальн[а-яіїєґ]*|сучасн[а-яіїєґ]*|флагманськ[а-яіїєґ]*|найкращ[а-яіїєґ]*|потужн[а-яіїєґ]*)(?:$|[^а-яіїєґʼ''a-z])'
